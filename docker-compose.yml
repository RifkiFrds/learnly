services:
  mysql:
    image: mysql:8.4
    container_name: learnly_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - learnly-network
    mem_limit: 800m
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: learnly_api
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@learnly_db:3306/${MYSQL_DATABASE}
    volumes:
      - learnly_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - learnly-network
      - proxy
    mem_limit: 350m

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://learnly_api:5000
    container_name: learnly_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_PROXY_TARGET: http://learnly_api:5000
      NEXT_PUBLIC_MAP_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    depends_on:
      - api
    networks:
      - learnly-network
      - proxy
    mem_limit: 300m

volumes:
  mysql_data:
    name: learnly_mysql_data
  learnly_uploads:
    name: learnly_uploads_data

networks:
  learnly-network:
    driver: bridge
  proxy:
    external: true