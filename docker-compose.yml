services:
  mysql:
    image: mysql:8.4
    container_name: learnly_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - learnly-network
    mem_limit: 800m
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: learnly_api
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@learnly_db:3306/${MYSQL_DATABASE}
      # Izinkan demo-seed jalan otomatis saat container start (lihat package.json → "start")
      ALLOW_DEMO_SEED: "true"
    volumes:
      - learnly_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - learnly-network
      - proxy
    # 350m terlalu kecil saat demo-seed (load aset + bcrypt banyak user). Set 1g.
    mem_limit: 1g

  db-backup:
    image: alpine:3.20
    container_name: learnly_db_backup
    restart: unless-stopped
    environment:
      MYSQL_HOST: learnly_db
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      BACKUP_RETENTION_DAYS: "30"
      TZ: Asia/Jakarta
    volumes:
      - ./ops/backup/backup-db.sh:/usr/local/bin/backup-db.sh:ro
      - ./ops/backup/crontab:/etc/crontabs/root:ro
      - learnly_backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - learnly-network
    mem_limit: 128m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Install mysql-client (untuk mysqldump), tzdata, findutils, gzip
        apk add --no-cache mariadb-client tzdata findutils gzip coreutils >/dev/null
        cp /usr/share/zoneinfo/Asia/Jakarta /etc/localtime 2>/dev/null || true
        echo "Asia/Jakarta" > /etc/timezone
        mkdir -p /backups /var/log
        touch /var/log/backup.log
        echo "[db-backup] jadwal cron:" && cat /etc/crontabs/root
        # Script di-mount read-only; panggil lewat `sh` agar tidak butuh bit executable
        sh /usr/local/bin/backup-db.sh || true
        # Jalankan busybox crond di foreground + tail log ke stdout
        crond -f -l 8 -L /var/log/cron.log &
        tail -F /var/log/backup.log

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://learnly_api:5000
    container_name: learnly_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_PROXY_TARGET: http://learnly_api:5000
      NEXT_PUBLIC_MAP_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    depends_on:
      - api
    networks:
      - learnly-network
      - proxy
    mem_limit: 300m

volumes:
  mysql_data:
    name: learnly_mysql_data
  learnly_uploads:
    name: learnly_uploads_data
  learnly_backups:
    name: learnly_backups_data

networks:
  learnly-network:
    driver: bridge
  proxy:
    external: true